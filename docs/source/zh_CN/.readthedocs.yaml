# Read the Docs configuration file — Chinese Simplified (translation project)
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# On Read the Docs, set "Path for .readthedocs.yaml" (Admin > Advanced Settings) to:
#   docs/source/zh_CN/.readthedocs.yaml

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/zh_CN/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
